services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: deeplearning-qdrant-1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deeplearning-backend-1
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      LLM_MODEL: llama3.2:1b
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      PYTHONUNBUFFERED: 1
      PYTHONHASHSEED: 0
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deeplearning-frontend-1
    ports:
      - "8501:8501"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend

volumes:
  qdrant_data:

networks:
  app-network:
    driver: bridge